name: storage source and host contracts
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      # Explicit compatibility hosts. Source discovery grants no runtime admission.
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotoba
          ref: f0ecb24b722664b825ab89992e9cc98c37ecaaf0
          path: .ci/kotoba
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/org-babashka-nbb
          ref: 1675e6aab65d5a99e37840cc5012bc2eca6f4a07
          path: .ci/org-babashka-nbb
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: .ci/org-babashka-nbb
      - run: npm ci --ignore-scripts --include=optional
        working-directory: providers/kotoba.kotobase.storage.ipfs
      - run: npm ci --ignore-scripts
        working-directory: providers/kotoba.kotobase.storage.s3
      - name: Source and complete recovery checks
        run: |
          node scripts/check-storage-sources.mjs
          node scripts/test-storage-sources.mjs "$RUNNER_TEMP/source-negative"
          node scripts/check-storage-history.mjs "$RUNNER_TEMP/history"
          node scripts/test-storage-history.mjs "$RUNNER_TEMP/history-negative"
      - name: JVM, public CLI/SCI, compiled Node and local R2 contracts
        run: >-
          python3 scripts/test-storage-hosts.py "$RUNNER_TEMP/storage-hosts"
          --kotoba "$GITHUB_WORKSPACE/.ci/kotoba"
          --engine "$GITHUB_WORKSPACE/.ci/org-babashka-nbb/cli.js"
